<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모닝 브리핑</title>
<style>
  :root { --bg:#e8f1fb; --card:#fff; --text:#1d2b3a; --muted:#6b7a8a; --accent:#2f7de1; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161d; --card:#1a232d; --text:#e6edf3; --muted:#93a1b0; --accent:#6cb0ff; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.4rem; margin:0; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .card h2 { font-size:1rem; margin:0 0 10px; }
  .big { font-size:2.4rem; font-weight:700; margin:0; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; }
  .grade { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:700; color:#fff; }
  .g-good { background:#2f7de1; } .g-normal { background:#2e9e5b; }
  .g-bad { background:#d97a00; } .g-worst { background:#c62828; }
  .muted { color:var(--muted); font-size:.85rem; }
  .error { color:var(--err); }
  .dog { width:100%; border-radius:12px; display:block; margin-bottom:10px; max-height:360px; object-fit:cover; }
  button { padding:10px 16px; font-size:1rem; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .api-box { font-size:.85rem; }
  .api-box code { word-break:break-all; display:block; margin:4px 0; }
  .api-box a { display:block; margin-bottom:10px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="greeting">안녕하세요!</h1>

  <section class="card" id="weather-card" aria-live="polite">
    <h2>🌤️ 우리 동네(서울) 날씨·미세먼지</h2>
    <p class="muted">불러오는 중…</p>
  </section>

  <section class="card" id="fx-card" aria-live="polite">
    <h2>💱 환율</h2>
    <p class="muted">불러오는 중…</p>
  </section>

  <section class="card" id="holiday-card" aria-live="polite">
    <h2>🎌 다음 공휴일</h2>
    <p class="muted">불러오는 중…</p>
  </section>

  <section class="card" id="dog-card" aria-live="polite">
    <h2>🐶 오늘의 강아지</h2>
    <p class="muted">불러오는 중…</p>
  </section>

  <p class="muted">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    · 환율 <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a>
    · 공휴일 <a href="https://date.nager.at/" target="_blank" rel="noopener">Nager.Date</a>
    · 사진 <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener">Dog CEO</a>
  </p>

  <section class="card api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <div id="api-list"></div>
  </section>
</main>

<script>
const API = {
  weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m&timezone=Asia%2FSeoul", // 🔌 서울 현재 기온
  air: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.5665&longitude=126.9780&current=pm10,pm2_5&timezone=Asia%2FSeoul", // 🔌 서울 PM10·PM2.5
  fx: "https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW,JPY", // 🔌 1달러 기준 원·엔 환율
  holiday: "https://date.nager.at/api/v3/NextPublicHolidays/KR", // 🔌 한국 다가오는 공휴일
  dog: "https://dog.ceo/api/breeds/image/random", // 🔌 랜덤 강아지 사진
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const failMsg = (what, e) => `<p class="error">😢 ${what}을(를) 불러오지 못했어요.</p><p class="muted">잠시 뒤 새로고침해 보세요. (${esc(e.message)})</p>`;

async function getJson(url) {
  const res = await fetch(url); // 🔌 API 호출
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// 인사말: 아침(4~11시) / 점심(11~17시) / 저녁(그 외)
function greet() {
  const h = new Date().getHours();
  if (h >= 4 && h < 11) return "☀️ 좋은 아침이에요!";
  if (h >= 11 && h < 17) return "🍚 맛있는 점심 드세요!";
  return "🌙 편안한 저녁 보내세요!";
}
$("greeting").textContent = greet();

// 한국 환경부 미세먼지 등급 (㎍/㎥)
const PM_GRADES = {
  pm10:  [[30, "좋음", "g-good"], [80, "보통", "g-normal"], [150, "나쁨", "g-bad"], [Infinity, "매우나쁨", "g-worst"]],
  pm2_5: [[15, "좋음", "g-good"], [35, "보통", "g-normal"], [75, "나쁨", "g-bad"],  [Infinity, "매우나쁨", "g-worst"]],
};
function grade(kind, v) {
  const [, label, cls] = PM_GRADES[kind].find(([max]) => v <= max);
  return `<span class="grade ${cls}">${label}</span>`;
}

// 카드 1: 날씨 + 미세먼지 (둘 중 하나만 실패해도 나머지는 보여 준다)
async function loadWeather() {
  const box = $("weather-card");
  const [w, a] = await Promise.allSettled([getJson(API.weather), getJson(API.air)]);
  let html = `<h2>🌤️ 우리 동네(서울) 날씨·미세먼지</h2>`;
  if (w.status === "fulfilled") {
    html += `<p class="big">${w.value.current.temperature_2m}°C</p>
      <p class="muted">기온 기준 시각: ${w.value.current.time.replace("T", " ")} (서울 시간)</p>`;
  } else html += failMsg("기온", w.reason);
  if (a.status === "fulfilled" && a.value.current.pm10 != null && a.value.current.pm2_5 != null) {
    const { pm10, pm2_5, time } = a.value.current;
    html += `<div class="row"><span>PM10 <b>${pm10}</b> ㎍/㎥</span>${grade("pm10", pm10)}</div>
      <div class="row"><span>PM2.5 <b>${pm2_5}</b> ㎍/㎥</span>${grade("pm2_5", pm2_5)}</div>
      <p class="muted">미세먼지 기준 시각: ${time.replace("T", " ")} (서울 시간, 모델 값 · 등급은 환경부 기준)</p>`;
  } else html += failMsg("미세먼지", a.reason ?? new Error("데이터 없음"));
  box.innerHTML = html;
}

// 카드 2: 환율 (Frankfurter는 하루 한 번 발표하는 기준값)
async function loadFx() {
  const box = $("fx-card");
  try {
    const d = await getJson(API.fx);
    const usd = d.rates.KRW;
    const jpy100 = d.rates.KRW / d.rates.JPY * 100;
    box.innerHTML = `<h2>💱 환율</h2>
      <div class="row"><span>1달러</span><b class="big" style="font-size:1.6rem">${usd.toLocaleString("ko-KR", {maximumFractionDigits: 1})}원</b></div>
      <div class="row"><span>100엔</span><b class="big" style="font-size:1.6rem">${jpy100.toLocaleString("ko-KR", {maximumFractionDigits: 1})}원</b></div>
      <p class="muted">기준 날짜: ${esc(d.date)} (하루 한 번 발표되는 기준값)</p>`;
  } catch (e) { box.innerHTML = `<h2>💱 환율</h2>` + failMsg("환율", e); }
}

// 카드 3: 다음 공휴일 D-day
async function loadHoliday() {
  const box = $("holiday-card");
  try {
    const list = await getJson(API.holiday);
    if (!list.length) throw new Error("다가오는 공휴일 정보가 없어요");
    const next = list[0];
    const [y, m, d] = next.date.split("-").map(Number);
    const now = new Date();
    const days = Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    box.innerHTML = `<h2>🎌 다음 공휴일</h2>
      <p class="big">${days === 0 ? "D-Day" : "D-" + days}</p>
      <p>${esc(next.localName)} <span class="muted">(${esc(next.name)})</span></p>
      <p class="muted">날짜: ${esc(next.date)}</p>`;
  } catch (e) { box.innerHTML = `<h2>🎌 다음 공휴일</h2>` + failMsg("공휴일", e); }
}

// 카드 4: 랜덤 강아지 + 새로고침
async function loadDog() {
  const box = $("dog-card");
  box.innerHTML = `<h2>🐶 오늘의 강아지</h2><p class="muted">강아지를 불러오는 중…</p>`;
  try {
    const d = await getJson(API.dog);
    box.innerHTML = `<h2>🐶 오늘의 강아지</h2>
      <img class="dog" src="${esc(d.message)}" alt="랜덤 강아지 사진">
      <button id="dog-btn" type="button">🔄 다른 강아지</button>`;
  } catch (e) {
    box.innerHTML = `<h2>🐶 오늘의 강아지</h2>` + failMsg("강아지 사진", e) +
      `<button id="dog-btn" type="button">🔄 다시 시도</button>`;
  }
  $("dog-btn").addEventListener("click", loadDog);
}

// 맨 아래 API 상자
$("api-list").innerHTML = Object.entries(API).map(([k, u]) =>
  `<div class="muted">${esc(k)}</div><code>${esc(u)}</code><a href="${esc(u)}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>`).join("");

// 카드마다 따로 불러서 하나가 실패해도 나머지는 보인다
loadWeather();
loadFx();
loadHoliday();
loadDog();
</script>
</body>
</html>
