<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 날씨</title>
<style>
  :root { --bg:#e8f1fb; --card:#fff; --text:#1d2b3a; --muted:#6b7a8a; --accent:#2f7de1; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161d; --card:#1a232d; --text:#e6edf3; --muted:#93a1b0; --accent:#6cb0ff; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.2rem; margin:0; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .emoji { font-size:4rem; line-height:1; }
  .temp { font-size:3rem; font-weight:700; margin:8px 0 0; }
  .desc { font-size:1.2rem; margin:4px 0 0; }
  .muted { color:var(--muted); font-size:.85rem; }
  .error { color:var(--err); }
  .api-box { font-size:.85rem; }
  .api-box code { word-break:break-all; display:block; margin:6px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>📍 서울의 지금 날씨</h1>

  <section class="card" id="weather-card" aria-live="polite">
    <p class="muted">날씨를 불러오는 중…</p>
  </section>

  <p class="muted">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>

  <section class="card api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <code id="api-url"></code>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </section>
</main>

<script>
const API = {
  weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia%2FSeoul", // 🔌 서울 현재 기온·날씨 코드
};

// WMO 날씨 코드 → [말, 이모지]
const WEATHER_CODES = {
  0:["맑음","☀️"], 1:["대체로 맑음","🌤️"], 2:["구름 조금","⛅"], 3:["흐림","☁️"],
  45:["안개","🌫️"], 48:["서리 안개","🌫️"],
  51:["가벼운 이슬비","🌦️"], 53:["이슬비","🌦️"], 55:["강한 이슬비","🌦️"],
  56:["얼어붙는 이슬비","🌧️"], 57:["강한 얼어붙는 이슬비","🌧️"],
  61:["약한 비","🌧️"], 63:["비","🌧️"], 65:["강한 비","🌧️"],
  66:["얼어붙는 비","🌧️"], 67:["강한 얼어붙는 비","🌧️"],
  71:["약한 눈","🌨️"], 73:["눈","🌨️"], 75:["강한 눈","❄️"], 77:["싸락눈","🌨️"],
  80:["약한 소나기","🌦️"], 81:["소나기","🌧️"], 82:["강한 소나기","⛈️"],
  85:["약한 눈 소나기","🌨️"], 86:["강한 눈 소나기","❄️"],
  95:["천둥번개","⛈️"], 96:["천둥번개와 약한 우박","⛈️"], 99:["천둥번개와 강한 우박","⛈️"],
};

const card = document.getElementById("weather-card");
document.getElementById("api-url").textContent = API.weather;
document.getElementById("api-link").href = API.weather;

async function loadWeather() {
  try {
    const res = await fetch(API.weather); // 🔌 API 호출
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const { temperature_2m, weather_code, time } = data.current;
    const [text, emoji] = WEATHER_CODES[weather_code] ?? ["알 수 없는 날씨", "❓"];
    card.innerHTML = `
      <div class="emoji">${emoji}</div>
      <p class="temp">${temperature_2m}°C</p>
      <p class="desc">${text}</p>
      <p class="muted">기준 시각: ${time.replace("T", " ")} (서울 시간)</p>`;
  } catch (e) {
    card.innerHTML = `<p class="error">😢 날씨를 불러오지 못했어요.</p>
      <p class="muted">잠시 뒤 새로고침해 보세요. (${e.message})</p>`;
  }
}
loadWeather();
</script>
</body>
</html>
