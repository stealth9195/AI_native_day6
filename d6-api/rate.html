<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환율 계산기</title>
<style>
  :root { --bg:#eef5ee; --card:#fff; --text:#1d2b22; --muted:#6b7a70; --accent:#2e8b57; --line:#cfd8d2; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101712; --card:#1a251e; --text:#e6efe9; --muted:#93a69a; --accent:#6fd09a; --line:#33443a; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.2rem; margin:0; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .row { display:flex; gap:8px; margin-bottom:16px; }
  input, select { font:inherit; padding:10px; border:1px solid var(--line); border-radius:10px;
                  background:var(--card); color:var(--text); min-width:0; }
  input { flex:1; }
  .result { font-size:2rem; font-weight:700; margin:0; }
  .muted { color:var(--muted); font-size:.85rem; margin:6px 0 0; }
  .error { color:var(--err); }
  .api-box { font-size:.85rem; }
  .api-box code { word-break:break-all; display:block; margin:6px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>💱 환율 계산기 (→ 원화)</h1>

  <section class="card">
    <div class="row">
      <input id="amount" type="number" min="0" step="any" value="1" aria-label="금액">
      <select id="currency" aria-label="통화">
        <option value="USD">USD 달러</option>
        <option value="JPY">JPY 엔</option>
        <option value="EUR">EUR 유로</option>
        <option value="CNY">CNY 위안</option>
      </select>
    </div>
    <div id="result" aria-live="polite"><p class="muted">환율을 불러오는 중…</p></div>
  </section>

  <p class="muted">환율 데이터: <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a> (유럽중앙은행 기준 환율, 하루 한 번 발표)</p>

  <section class="card api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <code id="api-url"></code>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </section>
</main>

<script>
const API = {
  rate: "https://api.frankfurter.dev/v1/latest?base={FROM}&symbols=KRW", // 🔌 {FROM}(선택한 통화) → 원화 기준 환율
};

const amountEl = document.getElementById("amount");
const currencyEl = document.getElementById("currency");
const resultEl = document.getElementById("result");
const urlEl = document.getElementById("api-url");
const linkEl = document.getElementById("api-link");

let rate = null; // 선택한 통화 1단위당 원화
let rateDate = "";

function render() {
  if (rate === null) return;
  const amount = parseFloat(amountEl.value);
  if (isNaN(amount) || amount < 0) {
    resultEl.innerHTML = `<p class="muted">금액을 입력해 주세요.</p>`;
    return;
  }
  const krw = Math.round(amount * rate).toLocaleString("ko-KR");
  const cur = currencyEl.value;
  resultEl.innerHTML = `
    <p class="result">${krw}원</p>
    <p class="muted">1 ${cur} = ${rate.toLocaleString("ko-KR", { maximumFractionDigits: 4 })}원</p>
    <p class="muted">기준 날짜: ${rateDate} (유럽중앙은행 발표 기준값)</p>`;
}

async function loadRate() {
  const url = API.rate.replace("{FROM}", currencyEl.value);
  urlEl.textContent = url;
  linkEl.href = url;
  rate = null;
  resultEl.innerHTML = `<p class="muted">환율을 불러오는 중…</p>`;
  try {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    rate = data.rates.KRW;
    rateDate = data.date;
    if (typeof rate !== "number") throw new Error("원화 환율이 없어요");
    render();
  } catch (e) {
    resultEl.innerHTML = `<p class="error">😢 환율을 불러오지 못했어요.</p>
      <p class="muted">잠시 뒤 다시 시도해 주세요. (${e.message})</p>`;
  }
}

currencyEl.addEventListener("change", loadRate);
amountEl.addEventListener("input", render);
loadRate();
</script>
</body>
</html>
