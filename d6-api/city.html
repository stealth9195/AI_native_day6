<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시 날씨·미세먼지</title>
<style>
  :root { --bg:#e8f1fb; --card:#fff; --text:#1d2b3a; --muted:#6b7a8a; --accent:#2f7de1; --err:#b3261e; --line:#c9d5e2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161d; --card:#1a232d; --text:#e6edf3; --muted:#93a1b0; --accent:#6cb0ff; --err:#ff8a80; --line:#33424f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  main { max-width:420px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.2rem; margin:0; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:10px;
          background:var(--card); color:var(--text); }
  button { padding:10px 16px; font-size:1rem; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .card h2 { font-size:1rem; margin:0 0 8px; }
  .temp { font-size:3rem; font-weight:700; margin:0; }
  .grade { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:700; color:#fff; }
  .g-good { background:#2f7de1; } .g-normal { background:#2e9e5b; }
  .g-bad { background:#d97a00; } .g-worst { background:#c62828; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:8px 0; }
  .muted { color:var(--muted); font-size:.85rem; }
  .error { color:var(--err); }
  .api-box { font-size:.85rem; }
  .api-box code { word-break:break-all; display:block; margin:4px 0; }
  .api-box a { display:block; margin-bottom:10px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🏙️ 도시 날씨·미세먼지</h1>

  <form id="form">
    <input id="city" type="text" placeholder="도시 이름 (예: 서울, Busan, Tokyo)" value="서울" required>
    <button type="submit">검색</button>
  </form>

  <section class="card" id="place-card" aria-live="polite">
    <p class="muted">도시 이름을 입력해 주세요.</p>
  </section>

  <section class="card" id="weather-card" aria-live="polite">
    <h2>🌡️ 기온</h2>
    <p class="muted">대기 중…</p>
  </section>

  <section class="card" id="air-card" aria-live="polite">
    <h2>😷 미세먼지</h2>
    <p class="muted">대기 중…</p>
  </section>

  <p class="muted">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    · 미세먼지 값은 관측소 실측이 아닌 Open-Meteo 대기질 모델 값이에요. 등급은 한국 환경부 기준.</p>

  <section class="card api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <div id="api-list" class="muted">검색하면 실제로 부른 주소가 여기에 나와요.</div>
  </section>
</main>

<script>
const API = {
  geocode: "https://geocoding-api.open-meteo.com/v1/search", // 🔌 도시 이름 → 위도·경도 (?name=&count=1&language=ko)
  weather: "https://api.open-meteo.com/v1/forecast",         // 🔌 현재 기온 (?latitude=&longitude=&current=temperature_2m)
  air: "https://air-quality-api.open-meteo.com/v1/air-quality", // 🔌 PM10·PM2.5 (?latitude=&longitude=&current=pm10,pm2_5)
};

// 한국 환경부 미세먼지 등급 기준 (㎍/㎥): [상한, 등급, CSS 클래스]
const PM_GRADES = {
  pm10:  [[30, "좋음", "g-good"], [80, "보통", "g-normal"], [150, "나쁨", "g-bad"], [Infinity, "매우나쁨", "g-worst"]],
  pm2_5: [[15, "좋음", "g-good"], [35, "보통", "g-normal"], [75, "나쁨", "g-bad"],  [Infinity, "매우나쁨", "g-worst"]],
};
function grade(kind, v) {
  const [, label, cls] = PM_GRADES[kind].find(([max]) => v <= max);
  return `<span class="grade ${cls}">${label}</span>`;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fail = (what, e) => `<p class="error">😢 ${what}을(를) 불러오지 못했어요.</p><p class="muted">잠시 뒤 다시 검색해 보세요. (${esc(e.message)})</p>`;

async function getJson(url) {
  const res = await fetch(url); // 🔌 API 호출
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function showApis(urls) {
  $("api-list").innerHTML = urls.map(([name, u]) =>
    `<div>${name}</div><code>${esc(u)}</code><a href="${esc(u)}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>`).join("");
}

async function loadWeather(lat, lon, url) {
  const box = $("weather-card");
  box.innerHTML = `<h2>🌡️ 기온</h2><p class="muted">기온을 불러오는 중…</p>`;
  try {
    const d = await getJson(url);
    const c = d.current;
    box.innerHTML = `<h2>🌡️ 기온</h2><p class="temp">${c.temperature_2m}°C</p>
      <p class="muted">기준 시각: ${c.time.replace("T", " ")} (현지 시간)</p>`;
  } catch (e) { box.innerHTML = `<h2>🌡️ 기온</h2>` + fail("기온", e); }
}

async function loadAir(url) {
  const box = $("air-card");
  box.innerHTML = `<h2>😷 미세먼지</h2><p class="muted">미세먼지를 불러오는 중…</p>`;
  try {
    const d = await getJson(url);
    const { pm10, pm2_5, time } = d.current;
    if (pm10 == null || pm2_5 == null) throw new Error("이 지역은 대기질 데이터가 없어요");
    box.innerHTML = `<h2>😷 미세먼지</h2>
      <div class="row"><span>PM10 (미세먼지) <b>${pm10}</b> ㎍/㎥</span>${grade("pm10", pm10)}</div>
      <div class="row"><span>PM2.5 (초미세먼지) <b>${pm2_5}</b> ㎍/㎥</span>${grade("pm2_5", pm2_5)}</div>
      <p class="muted">기준 시각: ${time.replace("T", " ")} (UTC, 모델 예측값)</p>`;
  } catch (e) { box.innerHTML = `<h2>😷 미세먼지</h2>` + fail("미세먼지", e); }
}

async function search(name) {
  const place = $("place-card");
  place.innerHTML = `<p class="muted">‘${esc(name)}’ 위치를 찾는 중…</p>`;
  const geoUrl = `${API.geocode}?name=${encodeURIComponent(name)}&count=1&language=ko`;
  showApis([["① 지오코딩", geoUrl]]);
  let g;
  try {
    const d = await getJson(geoUrl);
    if (!d.results?.length) {
      place.innerHTML = `<p class="error">‘${esc(name)}’ 도시를 찾지 못했어요.</p><p class="muted">철자를 확인하거나 영어 이름으로 검색해 보세요.</p>`;
      $("weather-card").innerHTML = `<h2>🌡️ 기온</h2><p class="muted">—</p>`;
      $("air-card").innerHTML = `<h2>😷 미세먼지</h2><p class="muted">—</p>`;
      return;
    }
    g = d.results[0];
  } catch (e) {
    place.innerHTML = fail("도시 위치", e);
    return;
  }
  const { latitude: lat, longitude: lon } = g;
  place.innerHTML = `<h2>📍 ${esc(g.name)}${g.country ? ", " + esc(g.country) : ""}</h2>
    <p class="muted">${g.admin1 ? esc(g.admin1) + " · " : ""}위도 ${lat}, 경도 ${lon}</p>`;

  const weatherUrl = `${API.weather}?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
  const airUrl = `${API.air}?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5`;
  showApis([["① 지오코딩", geoUrl], ["② 날씨 예보", weatherUrl], ["③ 대기질", airUrl]]);
  // 한 카드가 실패해도 다른 카드는 보이도록 따로 부른다
  loadWeather(lat, lon, weatherUrl);
  loadAir(airUrl);
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("city").value.trim();
  if (name) search(name);
});
search($("city").value);
</script>
</body>
</html>
